aid: passionfroot
name: Passionfroot
description: 'Passionfroot is a Berlin-based platform for creator-led go-to-market (GTM),
  pairing a self-service marketplace where business, productivity, and thought-leadership
  creators sell sponsorships, ad placements, and brand collaborations with an AI agent
  ("Zest") that helps brands discover creators, plan campaigns, run outreach, process
  payments (via its FrootWallet), and measure performance across Twitter/X, YouTube,
  Instagram, TikTok, LinkedIn, Beehiiv, and Substack. Creators manage storefronts,
  pricing, bookings, invoicing, and payouts in one place; the company monetizes by
  taking a commission on completed deals rather than charging a subscription. As of
  this enrichment pass Passionfroot exposes no public developer API, SDK, or developer
  documentation — it is an end-user SaaS product, not an API provider.'
