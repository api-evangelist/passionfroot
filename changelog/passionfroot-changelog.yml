  - version: 0.4.0
    date: '2026-08-06'
    npm_published: '2026-08-07'
    breaking: true
    breaking_note: >-
      read_only_queries now defaults to true for any source that sets `role` or
      `session_vars`; sources of that shape stop accepting non-SELECT SQL.
    highlights:
      - Automatic expansion of `SELECT *` to the caller's privilege-filtered columns.
      - Prisma annotations suppressed when no prisma_schema_path is configured; empty schema:// resource fixed.
      - "--http transport hardened for shared use: 4 MB body cap, per-server pool budget, session cap and idle timeout, Origin validation, constant-time bearer comparison, --token-file."
      - Tenant-scoped sources restricted to read-only SELECT queries, with extended-query-protocol as a second line of defence.
      - Incoming foreign keys annotated with join cardinality ([1:1] / [1:many]) plus fan-out warnings.
      - Schema introspection now checks has_column_privilege(SELECT) so it stops advertising unqueryable columns.
      - Timestamp/date columns no longer shifted by the server's local UTC offset.
