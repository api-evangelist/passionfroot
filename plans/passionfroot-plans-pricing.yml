note: >-
  Passionfroot is take-rate priced, not subscription priced, on the creator side: one
  free tier plus commission on completed deals. The brand/partner side is NOT publicly
  priced — the help centre references a paid "Starter Plan" and says the Free Plan has
  been phased out for partners, but no partner tier carries a published price and
  www.passionfroot.me/pricing returns 404. Only the creator-side tier is counted below;
  the unpriced partner tier is recorded separately so the absence is visible rather than
  silently dropped. These are API-EVANGELIST-CATALOGUED PLANS FOR THE PRODUCT — there is
  no API, so there are no API plans.
